# Auto-generated by embla-core:pipeline
pipelines:
  pull-requests:
    '**':
      - step:
          name: AI PR Review
          image: node:24
          clone:
            depth: full
          script:
            - |
              set -e
              mkdir -p docs/reviews
              REPORTED=0
              FAIL_CMD=""
              FAIL_LINE=""
              BASE_URL="https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/pullrequests/$BITBUCKET_PR_ID"

              # $1 = JSON body file, $2 = method, $3 = URL, $4 = log label. Prints only the HTTP status (C2);
              # the response body lands in /tmp/post-resp.json for id/url extraction.
              post_comment() {
                printf 'user = "%s:%s"\n' "$BITBUCKET_EMAIL" "$BITBUCKET_API_TOKEN" | curl -s -K - \
                  -X "$2" -H "Content-Type: application/json" \
                  -o /tmp/post-resp.json -w "%{http_code}" \
                  "$3" --data-binary "@$1" > /tmp/post-status.txt
                STATUS=$(cat /tmp/post-status.txt)
                echo "$4: HTTP $STATUS"
                case "$STATUS" in 2??) return 0 ;; *) return 1 ;; esac
              }

              # D2: posts outbox inline/general items, recording n -> posted URL ("" when the post failed).
              post_outbox_items() {
                echo '{}' > /tmp/outbox-map.json
                for KIND in inline general; do
                  COUNT=$(jq -r --arg k "$KIND" '(.[$k] // []) | length' docs/reviews/outbox.json)
                  i=0
                  while [ "$i" -lt "$COUNT" ]; do
                    N=$(jq -r --arg k "$KIND" --argjson i "$i" '.[$k][$i].n' docs/reviews/outbox.json)
                    case "$N" in ''|*[!0-9]*) i=$((i+1)); continue ;; esac
                    if [ "$KIND" = "inline" ]; then
                      jq --argjson i "$i" '.inline[$i] | {content: {raw: .body}, inline: {path: .path, to: .line}}' docs/reviews/outbox.json > /tmp/item.json
                    else
                      jq --argjson i "$i" '.general[$i] | {content: {raw: .body}}' docs/reviews/outbox.json > /tmp/item.json
                    fi
                    REF=""
                    if post_comment /tmp/item.json POST "$BASE_URL/comments" "Outbox $KIND $N"; then
                      URL=$(jq -r '.links.html.href // empty' /tmp/post-resp.json 2>/dev/null)
                      case "$URL" in https://bitbucket.org/*) REF="$URL" ;; esac
                    fi
                    jq --arg n "$N" --arg v "$REF" '. + {($n): $v}' /tmp/outbox-map.json > /tmp/outbox-map.next && mv /tmp/outbox-map.next /tmp/outbox-map.json
                    i=$((i+1))
                  done
                done
              }

              report_and_exit() {
                CODE="$1"
                MODE="$2"
                if [ "$REPORTED" = "1" ]; then exit "$CODE"; fi
                REPORTED=1
                set +e

                echo "AI PR Review: finishing (exit code $CODE, mode $MODE) — classifying outcome and reporting to Bitbucket next."

                apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq curl jq >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq curl jq || echo "curl/jq install failed — cost patch and/or fallback comment may not be postable, continuing anyway"; }

                COMMENT_ID=""
                [ -f docs/reviews/report-comment-id.txt ] && COMMENT_ID=$(cat docs/reviews/report-comment-id.txt)
                case "$COMMENT_ID" in ''|*[!0-9]*) COMMENT_ID="" ;; esac
                COST_JSON_OK=0
                if [ -f docs/reviews/pr-review-cost.json ] && jq -e '.total_cost_usd' docs/reviews/pr-review-cost.json >/dev/null 2>&1; then
                  COST_JSON_OK=1
                fi
                OUTBOX_OK=0
                OUTBOX_REPORT=0
                if [ -f docs/reviews/outbox.json ] && jq -e 'type == "object"' docs/reviews/outbox.json >/dev/null 2>&1; then
                  OUTBOX_OK=1
                  jq -e '.report.body | type == "string"' docs/reviews/outbox.json >/dev/null 2>&1 && OUTBOX_REPORT=1
                fi

                COST_LINE=""
                if [ "$COST_JSON_OK" = "1" ]; then
                  RAW_COST=$(jq -r '.total_cost_usd' docs/reviews/pr-review-cost.json)
                  COST=$(printf '%.2f' "$RAW_COST" 2>/dev/null || echo "n/a")
                  IN_TOK=$(jq -r '((.usage.input_tokens // 0) + (.usage.cache_creation_input_tokens // 0) + (.usage.cache_read_input_tokens // 0))' docs/reviews/pr-review-cost.json)
                  CACHE_TOK=$(jq -r '.usage.cache_read_input_tokens // 0' docs/reviews/pr-review-cost.json)
                  OUT_TOK=$(jq -r '.usage.output_tokens // 0' docs/reviews/pr-review-cost.json)
                  COST_LINE=$(printf '\n\n💰 **AI review cost:** `$%s` (`%s` in / `%s` out tokens; `%s` of input served from cache)\n\n_Token counts are the main review session only. The dollar figure is the authoritative whole-session total and includes every subagent._' "$COST" "$IN_TOK" "$OUT_TOK" "$CACHE_TOK")
                fi

                if [ "$MODE" = "review" ] && [ "$COST_JSON_OK" = "1" ] && { [ -n "$COMMENT_ID" ] || [ "$OUTBOX_REPORT" = "1" ]; }; then
                  if [ "$OUTBOX_OK" = "1" ]; then
                    post_outbox_items
                  fi
                  if [ "$OUTBOX_REPORT" = "1" ]; then
                    jq -n --slurpfile ob docs/reviews/outbox.json --slurpfile m /tmp/outbox-map.json --arg cost "$COST_LINE" \
                      '$ob[0].report.body as $b
                       | reduce ($m[0] | to_entries[]) as $e ($b;
                           if $e.value != ""
                           then gsub("\\(\\{\\{comment:" + $e.key + "\\}\\}\\)"; "(" + $e.value + ")")
                           else gsub("\\[(?<t>[^\\]]*)\\]\\(\\{\\{comment:" + $e.key + "\\}\\}\\)"; "`\(.t)`") end)
                       | gsub("\\[(?<t>[^\\]]*)\\]\\(\\{\\{comment:[0-9]+\\}\\}\\)"; "`\(.t)`")
                       | {content: {raw: (. + $cost)}}' > /tmp/report.json
                    post_comment /tmp/report.json POST "$BASE_URL/comments" "Review Report (outbox)" || echo "Review Report failed to post from the outbox — see status above, continuing to gate check"
                  else
                    EXISTING_RAW=$(printf 'user = "%s:%s"\n' "$BITBUCKET_EMAIL" "$BITBUCKET_API_TOKEN" | curl -s -K - "$BASE_URL/comments/$COMMENT_ID" | jq -r '.content.raw // ""')
                    if [ -n "$EXISTING_RAW" ]; then
                      jq -n --arg raw "${EXISTING_RAW}${COST_LINE}" '{content: {raw: $raw}}' > /tmp/report.json
                      post_comment /tmp/report.json PUT "$BASE_URL/comments/$COMMENT_ID" "Cost patch" || echo "Cost patch failed to post — see status above, continuing to gate check"
                    else
                      echo "Could not fetch existing Review Report comment ($COMMENT_ID) to patch cost into — continuing to gate check"
                    fi
                  fi

                  if [ "$CODE" -ne 0 ]; then
                    echo "This step is failing because AI PR Review found a failing gate (size or coverage) — see the Gates table in the Review Report comment on the PR for which one and why. Relaying its exit code ($CODE) here so Bitbucket's merge check sees it."
                  fi
                elif [ "$MODE" = "review" ] && [ -z "$COMMENT_ID" ] && [ "$OUTBOX_REPORT" = "0" ] && [ "$COST_JSON_OK" = "1" ] && [ "$CODE" = "0" ]; then
                  echo "AI PR Review: nothing to review this run (draft PR, closed/merged PR, or no new commits since the last review) — no summary comment was expected, so no cost or gate data to report."
                else
                  RUN_IS_ERROR=""
                  RUN_SUBTYPE=""
                  RUN_RESULT=""
                  if [ -f docs/reviews/pr-review-cost.json ]; then
                    RUN_IS_ERROR=$(jq -r '.is_error // "unknown"' docs/reviews/pr-review-cost.json 2>/dev/null)
                    RUN_SUBTYPE=$(jq -r '.subtype // "unknown"' docs/reviews/pr-review-cost.json 2>/dev/null)
                    RUN_RESULT=$(jq -r '.result // empty' docs/reviews/pr-review-cost.json 2>/dev/null | head -c 4000)
                  fi

                  if [ -n "$FAIL_CMD" ]; then
                    echo "AI PR Review did not complete — failed running: $FAIL_CMD (line $FAIL_LINE, exit $CODE). See the log above for the underlying error."
                  else
                    echo "AI PR Review did not complete successfully (exit $CODE) — no gate or cost data is available for this run. See the log above for the underlying error."
                  fi
                  [ "$RUN_IS_ERROR" = "true" ] && echo "    is_error: true, subtype: $RUN_SUBTYPE"
                  [ -n "$RUN_RESULT" ] && echo "    claude result: $RUN_RESULT"

                  if [ -n "$RUN_RESULT" ]; then
                    RESULT_BLOCK="$RUN_RESULT"
                  else
                    RESULT_BLOCK="<no result field available — see the step log>"
                  fi
                  jq -n --arg result "$RESULT_BLOCK" '{content: {raw: ("AI PR Review did not complete.\n\n```\n" + $result + "\n```\n\n🤖 Generated with Claude Code")}}' > /tmp/fallback.json
                  post_comment /tmp/fallback.json POST "$BASE_URL/comments" "Fallback comment" || echo "Fallback comment failed to post — see status above"
                  if [ "$CODE" = "0" ]; then CODE=1; fi
                fi

                exit "$CODE"
              }

              on_error() {
                report_and_exit "$1" "infra"
              }
              trap 'RC=$?; FAIL_CMD="$BASH_COMMAND"; FAIL_LINE="$LINENO"; on_error "$RC"' ERR
            - npm install -g @anthropic-ai/claude-code@2.1.207
            - useradd -m claudeuser
            - git clone https://github.com/EmblaTech/claude-plugins.git /tmp/plugins
            - git -C /tmp/plugins checkout REPLACE_WITH_MERGED_COMMIT
            - |
              ( set +e
                apt-get update -qq >/dev/null 2>&1
                apt-get install -y -qq jq >/dev/null 2>&1
                bb_get() {
                  printf 'user = "%s:%s"\n' "$BITBUCKET_EMAIL" "$BITBUCKET_API_TOKEN" | curl -s -K - "$1"
                }
                API="https://api.bitbucket.org/2.0/repositories/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/pullrequests/$BITBUCKET_PR_ID"
                bb_get "$API" > /tmp/pr.json
                bb_get "$API/commits?pagelen=100" > /tmp/commits.json
                bb_get "$API/comments?pagelen=100" > /tmp/comments.json
                jq -n --slurpfile pr /tmp/pr.json --slurpfile c /tmp/commits.json --slurpfile m /tmp/comments.json '{
                  pr: ($pr[0] | {id, state: (if .state == "OPEN" then "OPEN" elif .state == "MERGED" then "MERGED" else "CLOSED" end),
                       draft: (.draft // false), title, description, source_branch: .source.branch.name,
                       target_branch: .destination.branch.name, last_commit: .source.commit.hash}),
                  commits: [($c[0].values // [])[] | {hash, date}],
                  comments: [($m[0].values // [])[] | {id, raw: .content.raw, path: .inline.path, line: .inline.to,
                       date: .created_on, resolved: ((.resolution != null) or (.resolved == true))}]
                }' > /tmp/pr-context.json 2>/dev/null
                if jq -e '.pr.id' /tmp/pr-context.json >/dev/null 2>&1; then
                  mv /tmp/pr-context.json docs/reviews/pr-context.json
                  echo "PR pre-fetch: docs/reviews/pr-context.json written"
                else
                  echo "PR pre-fetch: fetch or parse failed — pr-review will rely on MCP reads only"
                fi
              ) || true
            # >>> tracker pre-fetch: setup replaces this entry with the tracker's block
            - 'echo "Ticket pre-fetch: no tracker configured"'
            # <<< tracker pre-fetch
            - |
              cat > /home/claudeuser/.pipeline-env <<PIPELINE_ENV
              export HOME=/home/claudeuser
              export ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY@Q}
              export BITBUCKET_API_TOKEN=${BITBUCKET_API_TOKEN@Q}
              export BITBUCKET_WORKSPACE=${BITBUCKET_WORKSPACE@Q}
              export BITBUCKET_EMAIL=${BITBUCKET_EMAIL@Q}
              export BITBUCKET_DEFAULT_WORKSPACE=${BITBUCKET_WORKSPACE@Q}
              PIPELINE_ENV
              chmod 600 /home/claudeuser/.pipeline-env
            - chown -R claudeuser:claudeuser docs/reviews /home/claudeuser /tmp/plugins
            - apt-get remove -y curl wget python3 netcat-traditional 2>/dev/null || true
            - |
              su claudeuser -c ". /home/claudeuser/.pipeline-env && rm -f /home/claudeuser/.pipeline-env && claude -p '/embla-core:pr-review $BITBUCKET_PR_ID --mode=pipeline' --output-format json --plugin-dir /tmp/plugins/plugins/embla-core --mcp-config .mcp.json --allowedTools 'Bash(git fetch:*),Bash(git diff:*),Grep,Write,Read,mcp__bitbucket__bb_get,mcp__bitbucket__bb_post' --model claude-sonnet-4-6" | tee docs/reviews/pr-review-cost.json
              REVIEW_EXIT=${PIPESTATUS[0]}
              # claude's exit code reflects harness completion, not the gate verdict (R5).
              if [ -f docs/reviews/gate-result.json ] && jq -e '.exit_code' docs/reviews/gate-result.json >/dev/null 2>&1; then
                GATE_EXIT=$(jq -r '.exit_code' docs/reviews/gate-result.json)
                case "$GATE_EXIT" in 0|1) REVIEW_EXIT="$GATE_EXIT" ;; esac
              fi
              report_and_exit "$REVIEW_EXIT" "review"
